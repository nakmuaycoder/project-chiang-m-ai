name: Daily Rice Nutrition SMS Notifier

on:
  schedule:
    # Runs every day at 08:00 UTC (10:00 CEST Paris time)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  notify-rice:
    name: Fetch Tomorrow Rice Plan & Send Free Mobile SMS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Daily Rice Notifier
        env:
          FREE_MOBILE_RECIPIENTS: ${{ secrets.FREE_MOBILE_RECIPIENTS }}
          FREE_MOBILE_USER: ${{ secrets.FREE_MOBILE_USER }}
          FREE_MOBILE_PASS: ${{ secrets.FREE_MOBILE_PASS }}
          TRAININGPEAKS_COOKIE: ${{ secrets.TRAININGPEAKS_COOKIE }}
          TRAININGPEAKS_ATHLETE_ID: ${{ secrets.TRAININGPEAKS_ATHLETE_ID }}
          SMS_LANG: ${{ secrets.SMS_LANG || vars.SMS_LANG || 'fr' }}
        run: uv run python scripts/notify_daily_rice.py
