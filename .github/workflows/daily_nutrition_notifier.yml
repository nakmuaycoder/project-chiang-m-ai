name: Daily Rice Nutrition SMS Notifier

on:
  schedule:
    # Runs every day at 08:00 UTC (10:00 CEST Paris time)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD). Leave empty for tomorrow.'
        required: false
        default: ''

jobs:
  notify-rice:
    name: Fetch Rice Plan & Send Free Mobile SMS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Daily Rice Notifier
        env:
          FREE_MOBILE_RECIPIENTS: ${{ secrets.FREE_MOBILE_RECIPIENTS }}
          FREE_MOBILE_USER: ${{ secrets.FREE_MOBILE_USER }}
          FREE_MOBILE_PASS: ${{ secrets.FREE_MOBILE_PASS }}
          TP_AUTH_COOKIE: ${{ secrets.TP_AUTH_COOKIE || secrets.TRAININGPEAKS_COOKIE }}
          TRAININGPEAKS_COOKIE: ${{ secrets.TRAININGPEAKS_COOKIE }}
          SMS_LANG: ${{ secrets.SMS_LANG || vars.SMS_LANG || 'fr' }}
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            uv run python scripts/notify_daily_rice.py --date ${{ github.event.inputs.target_date }}
          else
            uv run python scripts/notify_daily_rice.py
          fi
